name: lorem-ipsum-ai-mcp
description: Lorem Ipsum Ai automation via MCP. Includes generate lorem, generate
  words, generate sentences. By MEOK AI Labs.
version: 1.0.0
tools:
- name: generate_lorem
  description: MEOK AI Labs tool.
  parameters:
  - name: paragraphs
    type: integer
    required: false
- name: generate_words
  description: MEOK AI Labs tool.
  parameters:
  - name: count
    type: integer
    required: false
- name: generate_sentences
  description: MEOK AI Labs tool.
  parameters:
  - name: count
    type: integer
    required: false
- name: generate_themed
  description: MEOK AI Labs tool.
  parameters:
  - name: theme
    type: string
    required: true
  - name: paragraphs
    type: integer
    required: false
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
    - apiKey
    properties:
      apiKey:
        type: string
        description: Your MEOK API Key
  commandFunction: "(config) => ({\n  command: 'uvx',\n  args: ['lorem-ipsum-ai-mcp',\
    \ '--api-key', config.apiKey],\n  env: {\n    MEOK_API_KEY: config.apiKey\n  }\n\
    })"
